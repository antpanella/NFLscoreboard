name: Odds API coverage test

# One-off test for the bet recommender. Runs when this file is pushed, or by hand from the Actions tab.
# Costs about 14 of the 500 free monthly credits:
#   event list      0 credits
#   game lines      6 credits (3 markets x 2 regions: us = DraftKings etc., eu = Pinnacle)
#   props, 1 game   8 credits (4 markets x 2 regions)
# Results are committed to data/odds-test/ so Claude can read them from the repo.
# The API key comes from the repository secret ODDS_API_KEY and is never written to the repo.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/odds-test.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull test odds
        env:
          KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "Secret ODDS_API_KEY is missing"; exit 1; fi
          OUT=data/odds-test
          mkdir -p "$OUT"
          B=https://api.the-odds-api.com/v4/sports/americanfootball_nfl

          # Upcoming games (free)
          curl -sS -D "$OUT/events.headers" -o "$OUT/events.json" \
            "$B/events?apiKey=$KEY"

          # Game lines for every game: DraftKings (us) and Pinnacle (eu)
          curl -sS -D "$OUT/lines.headers" -o "$OUT/lines.json" \
            "$B/odds?apiKey=$KEY&regions=us,eu&markets=h2h,spreads,totals&oddsFormat=american"

          # Props for the next game that has not kicked off yet
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EID=$(jq -r --arg now "$NOW" \
            '[.[] | select(.commence_time > $now)] | sort_by(.commence_time) | .[0].id' \
            "$OUT/events.json")
          echo "Props test game: $EID"
          curl -sS -D "$OUT/props.headers" -o "$OUT/props.json" \
            "$B/events/$EID/odds?apiKey=$KEY&regions=us,eu&markets=player_pass_yds,player_rush_yds,player_reception_yds,player_anytime_td&oddsFormat=american"

          # Keep only the status line and the usage counters from the headers
          for f in "$OUT"/*.headers; do
            grep -iE '^(HTTP|x-requests)' "$f" > "$f.tmp" || true
            mv "$f.tmp" "$f"
          done

      - name: Commit results
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data/odds-test
          git commit -m "Odds API coverage test results" || echo "Nothing new to commit"
          git push
